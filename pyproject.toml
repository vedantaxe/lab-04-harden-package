[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvsummary"
version = "0.1.0"
description = "Summarize TVMaze show records"
dependencies = ["requests==2.34.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
